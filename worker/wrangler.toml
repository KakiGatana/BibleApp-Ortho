name = "blagovest-push"
main = "worker.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[triggers]
crons = ["*/15 * * * *"]

[vars]
# Assistant théologique : modèle, questions par personne et par jour, plafond global par mois
MODEL = "claude-opus-5-5"
DAILY_PER_IP = "15"
MONTHLY_CAP = "250"
# Traduction à la demande : modèle, textes nouveaux par personne et par jour, plafond mensuel global
TRANSLATE_MODEL = "claude-sonnet-5-5"
TR_PER_IP = "2000"
TR_MONTHLY_CAP = "6000"
# Adresse de ton site (sans chemin), pour restreindre le CORS. Ex. "https://moncompte.github.io"
ALLOWED_ORIGIN = "https://kakigatana.github.io"
# Contact exigé par le protocole VAPID
VAPID_SUBJECT = "mailto:contact@example.com"

# Après `npx wrangler kv namespace create SUBS`, colle ici l'id obtenu :
[[kv_namespaces]]
binding = "SUBS"
id = "57425c30950a484dab186198087c6fac"
